[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-taxonomy-arbiter"
version = "1.0.0"
description = "Deterministic Software Archetype & Architectural Decision Arbiter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Gao Sheng", email = "longgekutta@users.noreply.github.com"}
]
keywords = [
  "taxonomy",
  "architecture",
  "deterministic-evaluation",
  "classifier",
  "decision-matrix",
  "ucfs"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
tool-taxonomy-arbiter = "main:main"
arbiter = "main:main"
